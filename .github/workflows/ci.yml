name: Source validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -B -m unittest discover -s tests -v
      - run: python -B scripts/smoke_test.py
      - run: for file in web/*.js; do node --check "$file"; done
      # Hashes describe the original delivered files. Intentional edits should
      # update the manifest; never silently accept unexpected additions.
      - run: python -B scripts/verify_files.py
